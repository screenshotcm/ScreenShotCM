[package]
name = "screenshotcm"
version = "0.4.14"
edition = "2024"
description = "ScreenShotCM — screenshots and annotation for Windows"
license = "GPL-3.0-or-later"
publish = false

# One dependency, on purpose: every system service — tray, hotkeys, clipboard,
# image encoding (WIC) and drawing (Direct2D/DirectWrite) — is reached
# directly. Fewer crates is less weight, less memory and fewer licences.
# windows: MIT OR Apache-2.0.
[dependencies.windows]
version = "0.62.2"
features = [
    "ApplicationModel",
    "Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Vector2 and Matrix3x2 for Direct2D: part of the windows family, MIT OR Apache-2.0.
[dependencies.windows-numerics]
version = "0.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# A panic is logged by our hook first; unwinding buys nothing in an agent
# that has no recovery path above the message loop.
panic = "abort"
